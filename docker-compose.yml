# =============================================
# ClaimGraph AI — Docker Compose (Development)
# =============================================
# Usage:
#   docker compose up -d          → start all services
#   docker compose up -d postgres → start only postgres
#   docker compose logs -f backend → tail backend logs
#   docker compose down -v        → stop and remove volumes
# =============================================

services:
  # ── PostgreSQL + pgvector ───────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: claimgraph-postgres
    environment:
      POSTGRES_DB: claimgraph
      POSTGRES_USER: claimgraph_user
      POSTGRES_PASSWORD: claimgraph_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimgraph_user -d claimgraph"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  # ── Neo4j ───────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: claimgraph-neo4j
    environment:
      NEO4J_AUTH: neo4j/claimgraph_dev_password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p claimgraph_dev_password 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: claimgraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Zookeeper (for Kafka) ───────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: claimgraph-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    restart: unless-stopped

  # ── Kafka ───────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: claimgraph-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Backend ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimgraph-backend
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_LOG_LEVEL: DEBUG
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: claimgraph
      POSTGRES_USER: claimgraph_user
      POSTGRES_PASSWORD: claimgraph_dev_password
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: claimgraph_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      JWT_SECRET_KEY: dev-jwt-secret-change-in-production
      SECRET_KEY: dev-secret-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claimgraph-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  zookeeper_data:
  kafka_data:
